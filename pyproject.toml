[project]
name = "road-hazard-ai"
version = "1.0.0"
description = "Multimodal AI System for Detecting Road Hazards & Prioritizing Infrastructure Maintenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    "requests>=2.31.0",
    "google-genai>=0.1.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

